<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heavy-Metal Wiki | Cadastro</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <div class="header">
        <div class="container">
            <h1 class="titulo">Heavy-Metal Wiki</h1>
            <ul class="navbar">
                <li>
                    <a href="index.html">Início</a>
                </li>
                <span class="barra">|</span>
                <li>
                    <a href="login.html">Login</a>
                </li>
                <span class="barra">|</span>
                <li class="agora">
                    <a href="#">Cadastro</a>
                </li>
            </ul>
        </div>
    </div>

    <form class="cadastro-container">
        <h2>Cadastro</h2>
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
        <label for="confirmar-senha">Confirmar senha</label>
        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme sua senha" required>
        <button type="submit">Cadastrar</button>
        <div class="link-login">
            Já tem conta? <a href="login.html">Faça login</a>
        </div>
    </form>
</body>
</html>
