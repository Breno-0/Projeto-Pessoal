<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heavy-Metal Wiki | Cadastro</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>
    <header>
        <div class="container">
            <h1 class="titulo">Heavy-Metal Wiki</h1>
            <ul class="navbar">
                <li>
                    <a href="index.html">Início</a>
                </li>
                <span class="barra">|</span>
                <li>
                    <a href="login.html">Login</a>
                </li>
                <span class="barra">|</span>
                <li class="agora">
                    <a href="#">Cadastro</a>
                </li>
            </ul>
        </div>
    </header>

    <div class="cadastro-container">

        <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>


        <h2>Cadastro</h2>
        <label for="nome">Nome completo</label>
        <input type="text" id="nome_input" placeholder="Digite seu nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email_input" placeholder="Digite seu e-mail" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha_input" placeholder="Crie uma senha" required>

        <label for="confirmar-senha">Confirmar senha</label>
        <input type="password" id="confirmacao_senha_input" placeholder="Confirme sua senha" required>

        <label>Quais bandas você mais gostou?</label>
        <br>
        <div class="bandasFavoritas">
            <div>
                <label for="soad">SOAD</label>
                <input type="checkbox" id="soad" >
            </div>
            <div>
                <label for="slipknot">Slipknot</label>
                <input type="checkbox" id="slipknot" >
            </div>
            <div>
                <label for="metallica">Metallica</label>
                <input type="checkbox" id="metallica" >
            </div>
            <div>
                <label for="blacksabbath">Black Sabbath</label>
                <input type="checkbox" id="blacksabbath" >
            </div>
        </div>

        <div id="div_aguardar" class="loading-div" style="display: none;">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>

        <button onclick="cadastrar()">Cadastrar</button>

        <div class="link-login">
            Já tem conta? <a href="login.html">Faça login</a>
        </div>


    </div>

    
</body>

<script>

  

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var soadVar = document.getElementById("soad").checked ? 1 : 0;
    var slipknotVar = document.getElementById("slipknot").checked ? 1 : 0; 
    var metallicaVar = document.getElementById("metallica").checked ? 1 : 0;
    var blackSabbathVar = document.getElementById("blacksabbath").checked ? 1 : 0;

    console.log('valor soad:', soad);

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        soadServer: soadVar,
        slipknotServer: slipknotVar,
        metallicaServer: metallicaVar,
        blackSabbathServer: blackSabbathVar
        
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>


</html>
