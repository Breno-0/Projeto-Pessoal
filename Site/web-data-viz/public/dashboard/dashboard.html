<script>

    let dados = [];

    let soad = 0
    let metallica = 0
    let slip = 0
    let black = 0

    

    function pegar() {
        fetch("/informacoes/pegar", {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
            }


        })

            .then(function (resposta) {
                

                if (resposta.ok) {
                    resposta.json().then(data => {
                        
                        dados = data

                        separar()
                        maisVotos()
                        votosTotais()
                    })
                } else {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
                finalizarAguardar();
            });

        return false;
    }

    function separar() {

        soad = dados[0].SOAD;
        slip = dados[0].Slipknot;
        metallica = dados[0].Metallica;
        black = dados[0].BlackSabbath;

        

        //Gráfico de Barras
    const ctx = document.getElementById('graficoBarra');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['System of a Down', 'Slipknot', 'Metallica', 'Black Sabbath'],
            datasets: [{
                label: 'Votos por Bandas',
                data: [soad, slip, metallica, black],
                borderWidth: 2,
                backgroundColor: ['#0057d9', '#ffff', '#00FF7F', '#FF0000'] 
                
            }]
        },
        options: {
            indexAxis: 'x',
            scales: {
                y: {
                    beginAtZero: true
                },
                x: {
                    ticks: {
                        font: {
                            size: 20,
                            family: 'Poppins'
                        },
                        color: 'white'
                    }
                }
            },
            plugins: {
                legend: {
                    labels: {
                        font: {
                            size: 30,
                            family: 'Poppins'
                        },
                        color: 'white'
                    }
                }
            }
        }
    });

    
}

let maior = 0

function maisVotos(){

    let indice = 0
    let frase = "";

        soad = dados[0].SOAD;
        slip = dados[0].Slipknot;
        metallica = dados[0].Metallica;
        black = dados[0].BlackSabbath;

        
    let votos = [soad, slip, metallica, black]
    

    for(let i = 0 ; i < votos.length; i++){
        
        if(votos[i] > maior){
            
            maior = votos[i]
            indice = i
        }
    }

    if(indice == 0){
        frase = 'System of a Down'
    }else if(indice == 1){
        frase = 'SlipKnot'
    }else if(indice == 2){
        frase = 'Metallica'
    }else if(indice == 3){
        frase = 'Black Sabbath'
    }

    div_maisVotos.innerHTML = `A Banda com mais Votos é: ${frase}`

    
}
