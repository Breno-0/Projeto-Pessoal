<script>

    let dados = [];
    
    

    let soad = 0
    let metallica = 0
    let slip = 0
    let black = 0

    

    function pegar() {
        fetch("/informacoes/pegar", {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
            }

        })

            .then(function (resposta) {
                

                if (resposta.ok) {
                    resposta.json().then(data => {
                        
                        dados = data

                        separar()
                        maisVotos()
                        votosTotais()
                        porcentagem()
                        
                    })
                } else {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
                finalizarAguardar();
            });

        return false;
    }

    function separar() {

        soad = dados[0].SOAD;
        slip = dados[0].Slipknot;
        metallica = dados[0].Metallica;
        black = dados[0].BlackSabbath;

    
    const ctx = document.getElementById('graficoBarra');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['System of a Down', 'Slipknot', 'Metallica', 'Black Sabbath'],
            datasets: [{
                label: 'Votos por Banda:',
                data: [soad, slip, metallica, black],
                borderWidth: 2,
                backgroundColor: ['#FF4500', '#8B0000', '#E0FFFF', '#8B008B'] 
            }]
        },
        options: {
            indexAxis: 'x',
            scales: {
                y: {
                    beginAtZero: true
                },
                x: {
                    ticks: {
                        font: {
                            size: 20,
                            family: 'Barlow'
                        },
                        color: 'white'
                    }
                }
            },
            plugins: {
                legend: {
                    labels: {
                        font: {
                            size: 0,
                            family: 'Barlow'
                        },
                        color: 'white'
                    }
                },
                 title: {
                 display: true,
                 text: 'Votos por Banda:',
                 font: {
                    size: 40,
                    family: 'Barlow'
                 },
                 color: 'white'
             }
            }
        }
    });

    
}

function porcentagem(){

        soad = dados[0].SOAD  ;
        slip = dados[0].Slipknot;
        metallica = dados[0].Metallica;
        black = dados[0].BlackSabbath;

    const ctx = document.getElementById('graficoPizza');
    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['System of a Down', 'Slipknot', 'Metallica', 'Black Sabbath'],
            datasets: [{
                label: 'Votos por Banda:',
                data: [soad, slip, metallica, black],
                borderWidth: 2,
                backgroundColor: ['#FF4500', '#8B0000', '#E0FFFF', '#8B008B'] 
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    labels: {
                        font: {
                            size: 20,
                            family: 'Barlow'
                        },
                        color: 'white'
                    }
                },
                 title: {
                 display: true,
                 text: 'Porcentagem de Aprovação:',
                 font: {
                    size: 30,
                    family: 'Barlow'
                 },
                 color: 'white'
             }
            }
        }
    });
}

let maior = 0

function maisVotos(){

    let indice = 0
    let frase = "";

        soad = dados[0].SOAD;
        slip = dados[0].Slipknot;
        metallica = dados[0].Metallica;
        black = dados[0].BlackSabbath;

        
    let votos = [soad, slip, metallica, black]
    

    for(let i = 0 ; i < votos.length; i++){
        
        if(votos[i] > maior){
            
            maior = votos[i]
            indice = i
        }
    }

    if(indice == 0){
        frase = '<span style="color: #FF4500;">System of a Down</span>'
    }else if(indice == 1){
        frase = '<span style="color: #8B0000;">Slipknot</span>'
    }else if(indice == 2){
        frase = '<span style="color: #E0FFFF;">Metallica</span>'
    }else if(indice == 3){
        frase = '<span style="color: #8B008B;">Black Sabbath</span>'
    }

    div_maisVotos.innerHTML = `A Banda com mais Votos é: ${frase}`

    
}

                        div_totalUsuarios.innerHTML = `Totais de Usuários que participaram dos Votos: <span style="color: #00FF00;">${qtdusuarios}</span>`

                        
                    })
                } else {

                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
                finalizarAguardar();
            });
            
            
        return false;

}
